name: CI

on:
  push:
    branches:
      - trunk
    paths:
      - 'Android/MMKV/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'Android/MMKV/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: |
          cd Android/MMKV
          ./gradlew build
