import com.android.build.api.artifact.SingleArtifact
import com.android.build.gradle.tasks.SourceJarTask
import com.vanniktech.maven.publish.AndroidMultiVariantLibrary
import com.vanniktech.maven.publish.JavadocJar
import com.vanniktech.maven.publish.SourcesJar

import javax.inject.Inject

plugins {
    id 'com.android.library'
    id 'com.vanniktech.maven.publish'
}

android {
    namespace "com.tencent.mmkv"
    defaultConfig {
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            externalNativeBuild {
                cmake {
                    arguments "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,-s"
                    cppFlags "-fvisibility=hidden", "-funwind-tables", "-fasynchronous-unwind-tables", "-O2"
                }
            }
            consumerProguardFiles 'proguard-rules.pro'
//            debuggable true
//            jniDebuggable true
        }
        debug {
            jniDebuggable true
        }
    }
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version "3.18.0+"
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
    flavorDimensions = ["stl_mode"]
    productFlavors {
        DefaultCpp {
            isDefault = true
            dimension "stl_mode"
        }
        StaticCpp {
            dimension "stl_mode"
        }
        SharedCpp {
            dimension "stl_mode"
        }
    }
    buildFeatures {
        buildConfig true
        prefab true
        prefabPublishing true
        aidl true
    }
    prefab {
        mmkv {
            headers "../../../Core/include"
        }
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def flavorName = variant.flavorName
        if (flavorName == 'DefaultCpp' || flavorName == 'StaticCpp') {
            variant.externalNativeBuild?.with {
                arguments.addAll("-DANDROID_STL=c++_static")
                cppFlags.addAll("-DMMKV_STL_SHARED=0")
            }
        } else if (flavorName == 'SharedCpp') {
            variant.externalNativeBuild?.with {
                arguments.addAll("-DANDROID_STL=c++_shared")
                cppFlags.addAll("-DMMKV_STL_SHARED=1")
            }
        }

        if (variant.buildType == 'release') {
            def verifyTask = tasks.register("verify${variant.name.capitalize()}Aar", VerifyAarTask) {
                aarFile = variant.artifacts.get(SingleArtifact.AAR.INSTANCE)
            }
            tasks.named("check").configure {
                dependsOn(verifyTask)
            }
        }
    }
}

mavenPublishing {
    def buildTypes = ['release'] as Set
    def variants = ['stl_mode': ['DefaultCpp'] as Set]
    configure(new AndroidMultiVariantLibrary(new JavadocJar.Javadoc(), new SourcesJar.Sources(), buildTypes, variants))
}

tasks.withType(SourceJarTask).configureEach {
    doFirst {
        // Fix `Cannot copy file '.../MMKV/Android/MMKV/mmkv/build/generated/aidl_source_output_dir/DefaultCppRelease/out/com/tencent/mmkv/ParcelableMMKV.java'
        //  to 'com/tencent/mmkv/ParcelableMMKV.java' because file '.../MMKV/Android/MMKV/mmkv/src/main/java/com/tencent/mmkv/ParcelableMMKV.java'
        //  has already been copied there.`
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

dependencies {
    implementation project(':mmkvannotation')

    implementation 'androidx.annotation:annotation:1.10.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}

abstract class VerifyAarTask extends DefaultTask {
    private final ArchiveOperations archiveOperations

    @Inject
    VerifyAarTask(ArchiveOperations archiveOperations) {
        this.archiveOperations = archiveOperations
    }

    @InputFile
    abstract RegularFileProperty getAarFile()

    @TaskAction
    void verify() {
        def tree = archiveOperations.zipTree(aarFile)
        def expectedAbis = ['armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64']
        def maxAllowedSoSize = 2.5 * 1024 * 1024 // 2.5 MB max for stripped libmmkv.so

        for (abi in expectedAbis) {
            def jniFiles = tree.matching { include "jni/${abi}/libmmkv.so" }.files
            def prefabFiles = tree.matching { include "prefab/modules/mmkv/libs/android.${abi}/libmmkv.so" }.files

            if (jniFiles.empty) {
                throw new GradleException("Missing jni/${abi}/libmmkv.so in AAR")
            }
            if (prefabFiles.empty) {
                throw new GradleException("Missing prefab/modules/mmkv/libs/android.${abi}/libmmkv.so in AAR")
            }

            def jniSize = jniFiles.first().length()
            def prefabSize = prefabFiles.first().length()

            if (jniSize > maxAllowedSoSize) {
                throw new GradleException("jni/${abi}/libmmkv.so is abnormally large (${jniSize} bytes). Debug symbols might not be stripped.")
            }
            if (prefabSize > maxAllowedSoSize) {
                throw new GradleException("prefab/modules/mmkv/libs/android.${abi}/libmmkv.so is abnormally large (${prefabSize} bytes). Debug symbols might not be stripped.")
            }

            if (Math.abs(jniSize - prefabSize) > 1024) {
                throw new GradleException("Size mismatch between jni and prefab for ${abi}: jni=${jniSize}, prefab=${prefabSize}")
            }
        }
    }
}
