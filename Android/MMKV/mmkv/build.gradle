import com.vanniktech.maven.publish.AndroidMultiVariantLibrary

plugins {
    id 'com.android.library'
    id 'com.vanniktech.maven.publish'
}

android {
    namespace "com.tencent.mmkv"
    defaultConfig {
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        externalNativeBuild {
            cmake {
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            externalNativeBuild {
                cmake {
                    cppFlags "-fvisibility=hidden", "-funwind-tables", "-fasynchronous-unwind-tables", "-O2"
                }
            }
            consumerProguardFiles 'proguard-rules.pro'
//            debuggable true
//            jniDebuggable true
        }
        debug {
            jniDebuggable true
        }
    }
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version "3.18.0+"
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }
    flavorDimensions = ["stl_mode"]
    productFlavors {
        DefaultCpp {
            isDefault = true
            dimension "stl_mode"
        }
        StaticCpp {
            dimension "stl_mode"
        }
        SharedCpp {
            dimension "stl_mode"
        }
    }
    buildFeatures {
        buildConfig true
        prefab true
        prefabPublishing true
        aidl true
    }
    prefab {
        mmkv {
            headers "../../../Core/include"
        }
    }
}

androidComponents {
    onVariants(selector().all()) { variant ->
        def flavorName = variant.flavorName
        if (flavorName == 'DefaultCpp' || flavorName == 'StaticCpp') {
            variant.externalNativeBuild?.with {
                arguments.addAll("-DANDROID_STL=c++_static")
                cppFlags.addAll("-DMMKV_STL_SHARED=0")
            }
        } else if (flavorName == 'SharedCpp') {
            variant.externalNativeBuild?.with {
                arguments.addAll("-DANDROID_STL=c++_shared")
                cppFlags.addAll("-DMMKV_STL_SHARED=1")
            }
        }
    }
}

mavenPublishing {
    def buildTypes = ['release'] as Set
    def variants = ['stl_mode': ['DefaultCpp'] as Set]
    configure(new AndroidMultiVariantLibrary(true, true, buildTypes, variants))
}

tasks.withType(Jar).configureEach {
    doFirst {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

dependencies {
    implementation project(':mmkvannotation')

    implementation 'androidx.annotation:annotation:1.10.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
